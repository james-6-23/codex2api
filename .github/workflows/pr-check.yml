name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
      - codex/**
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.head_ref || github.ref_name }}
        run: npm run build

  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --enable-only=govet --timeout=10m ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      - name: Run Go tests
        run: go test -count=1 -timeout 8m ./...

  test-race:
    name: test-race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin-a-l
          - name: admin-m-z
          - name: database
          - name: proxy
          - name: promptfilter
          - name: rest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      # 重包各占一台 2 核 runner,避免 admin/database/proxy/promptfilter 互相抢核。
      # admin 按测试名首字母再拆两片:整包 -race 在 2 核 runner 上要 ~12min,
      # 会撞 go test 的 12m 超时(2026-08-26 main 上连续两次超时失败)。
      - name: Run Go tests with race detector
        run: |
          set -euo pipefail
          args="$(bash .github/scripts/go-race-packages.sh '${{ matrix.name }}')"
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout 12m $args
